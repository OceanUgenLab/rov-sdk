name: close-linked-issues

# GitHub ignores the closing keywords (Closes / Fixes / Resolves) when a pull request
# targets a branch other than the repository's default branch: no link is created and
# merging has no effect on the issue. This fills that gap for the feature -> develop flow.
# Pull requests into the default branch are left to GitHub's native behaviour.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const nums = [...new Set([...((pr.body || '').matchAll(re))].map((m) => Number(m[1])))];
            if (nums.length === 0) {
              core.info('No closing keywords in the PR body; nothing to close.');
              return;
            }
            for (const n of nums) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n });
              if (issue.state !== 'open') {
                core.info(`#${n} is already ${issue.state}; skipping.`);
                continue;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: n,
                body: `Closed by #${pr.number} (merged into \`${pr.base.ref}\`).`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: n, state: 'closed' });
              core.info(`Closed #${n}.`);
            }
