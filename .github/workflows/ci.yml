name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build

      - name: test
        run: ctest --test-dir build --output-on-failure

  examples:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: build host_command_sender
        run: |
          cmake -S examples/host_command_sender -B /tmp/ex-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ex-host

      - name: build board_telemetry_receiver
        run: |
          cmake -S examples/board_telemetry_receiver -B /tmp/ex-board -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ex-board
